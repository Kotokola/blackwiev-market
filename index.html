<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>BLACKWIEV NFT Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bgCanvas"></canvas>

<header class="hdr">
    <div class="hdr-inner">
        <div class="hdr-logo"><i class="fa-solid fa-gem"></i> NFT Market</div>
        <div class="hdr-bal">USDT <span id="balUsdt">0.00</span></div>
    </div>
</header>

<main class="app">

    <!-- ===== ПРАВИЛА ===== -->
    <section class="scr active" id="scrRules">
        <div class="box">
            <div class="box-icon"><i class="fa-solid fa-scroll"></i></div>
            <h2>NFT Market</h2>
            <p class="dim">Примите правила для доступа к маркету</p>
            <a class="link" href="https://telegra.ph/PRAVILA-MAGAZINA-BLACKWIEV-NFT-MARKET-05-29" target="_blank">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Правила
            </a>
            <label class="chk">
                <input type="checkbox" id="cbRules">
                <span>Я принимаю условия</span>
            </label>
            <button class="btn" id="btnRules" disabled>Принять и войти</button>
            <div class="msg" id="msgRules"></div>
        </div>
    </section>

    <!-- ===== МЕНЮ ===== -->
    <section class="scr" id="scrMenu">
        <div class="box">
            <h2>Главное меню</h2>
            <p class="dim">Выберите действие</p>
            <div class="menu3">
                <button class="mbtn" data-go="sell"><i class="fa-solid fa-hand-holding-dollar"></i>Продать</button>
                <button class="mbtn" data-go="buy"><i class="fa-solid fa-bag-shopping"></i>Купить</button>
                <button class="mbtn" data-go="profile"><i class="fa-solid fa-user"></i>Профиль</button>
            </div>
        </div>
    </section>

    <!-- ===== ПРОДАТЬ ===== -->
    <section class="scr" id="scrSell">
        <div class="box">
            <div class="head"><h2>Продать NFT</h2><button class="back" data-back="menu"><i class="fa-solid fa-arrow-left"></i></button></div>
            <div class="col2">
                <div>
                    <h3 class="stitle">Инвентарь</h3>
                    <div id="sellList" class="vlist"></div>
                    <div class="empty" id="sellEmpty"><i class="fa-solid fa-box-open"></i>Пусто</div>
                </div>
                <div>
                    <h3 class="stitle">Продажа</h3>
                    <div class="field"><label>NFT</label><div class="sel-nft" id="sellSel">Не выбран</div></div>
                    <div class="field"><label>Цена (USDT)</label><input type="number" min="0.1" step="0.01" id="sellPrice" placeholder="10"></div>
                    <button class="btn" id="btnSell" disabled>Выставить</button>
                    <div class="msg" id="msgSell"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== КУПИТЬ ===== -->
    <section class="scr" id="scrBuy">
        <div class="box">
            <div class="head"><h2>Магазин</h2><button class="back" data-back="menu"><i class="fa-solid fa-arrow-left"></i></button></div>
            <div id="marketList" class="vlist"></div>
            <div class="empty" id="marketEmpty"><i class="fa-solid fa-store"></i>Пока пусто</div>
        </div>
    </section>

    <!-- ===== ПРОФИЛЬ ===== -->
    <section class="scr" id="scrProfile">
        <div class="box">
            <div class="head"><h2>Профиль</h2><button class="back" data-back="menu"><i class="fa-solid fa-arrow-left"></i></button></div>
            <div class="prof-top">
                <div class="avatar" id="av"><i class="fa-solid fa-user"></i></div>
                <div class="prof-info">
                    <div class="prof-name" id="pName">Загрузка...</div>
                    <div class="prof-sub"><span id="pUser">—</span> · ID <span id="pId">—</span></div>
                </div>
            </div>
            <div class="tabs">
                <button class="tab active" data-tab="inv">Инвентарь</button>
                <button class="tab" data-tab="wd">Вывод</button>
                <button class="tab" data-tab="tx">История</button>
            </div>
            <div class="tabcont active" data-tab="inv">
                <div id="profInv" class="vlist"></div>
                <div class="empty" id="profInvE"><i class="fa-solid fa-box-open"></i>Пусто</div>
            </div>
            <div class="tabcont" data-tab="wd">
                <h3 class="stitle">Вывод средств</h3>
                <div class="field"><label>Сумма (USDT)</label><input type="number" min="1" id="wdAmt" placeholder="Минимум 1"></div>
                <div class="field"><label>Кошелёк</label><input type="text" id="wdWallet" placeholder="Адрес"></div>
                <button class="btn" id="btnWd">Создать заявку</button>
                <div class="msg" id="msgWd"></div>
            </div>
            <div class="tabcont" data-tab="tx">
                <h3 class="stitle">История</h3>
                <div id="txList" class="vlist"></div>
                <div class="empty" id="txE"><i class="fa-solid fa-clock-rotate-left"></i>Пусто</div>
            </div>
        </div>
    </section>

</main>

<!-- Модалка NFT -->
<div class="overlay" id="overlay">
    <div class="modal">
        <button class="mclose" id="mClose"><i class="fa-solid fa-xmark"></i></button>
        <img class="mimg" id="mImg" src="" alt="">
        <div class="mbadge" id="mRarity">—</div>
        <h2 id="mTitle">—</h2>
        <div class="mprice" id="mPrice">—</div>
        <div class="mseller" id="mSeller">—</div>
        <div class="mdetails">
            <div><span>Ссылка</span><span id="mLink">—</span></div>
            <div><span>Редкость</span><span id="mRarText">—</span></div>
        </div>
        <button class="btn btn-buy" id="btnBuy" disabled>Купить через заявку</button>
        <div class="msg" id="msgBuy"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
